# XSSPLOIT Personal Edition — single-VM deployment.
# Build & run:  docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --build
#
# Required env (export before compose, or put in repo-root .env):
#   NEXT_PUBLIC_API_URL         — e.g. https://api.yourdomain.com
#   NEXT_PUBLIC_LOCAL_AUTH_TOKEN — same value as LOCAL_AUTH_TOKEN below
#   LOCAL_AUTH_TOKEN            — openssl rand -hex 32
#   CALLBACK_DOMAIN             — e.g. cb.yourdomain.com (no scheme)

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: /data/xssploit.db
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN:?set LOCAL_AUTH_TOKEN}
      CALLBACK_DOMAIN: ${CALLBACK_DOMAIN:-localhost:5001}
      CALLBACK_TOKEN_SECRET: ${CALLBACK_TOKEN_SECRET:-change-me-please}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LOG_LEVEL: info
    volumes:
      - api-data:/data
    ports:
      - "4000:4000"
    networks: [xssploit]

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
      args:
        # Leave unset so the dashboard uses the same-origin /api/* rewrite below —
        # one hop less (no browser→nginx→api round trip) and no CORS preflight.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_LOCAL_AUTH_TOKEN: ${NEXT_PUBLIC_LOCAL_AUTH_TOKEN:-}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Where the Next.js server proxies /api/* (container-to-container).
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    networks: [xssploit]

  callback:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.callback
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      CALLBACK_HOST: 0.0.0.0
      CALLBACK_PORT: 5001
      CALLBACK_DATA_DIR: /data/callbacks
      CALLBACK_PUBLIC_BASE: ${CALLBACK_PUBLIC_BASE:-http://localhost:5001}
    volumes:
      - callback-data:/data/callbacks
    ports:
      - "5001:5001"
    networks: [xssploit]

networks:
  xssploit:
    driver: bridge

volumes:
  api-data:
  callback-data:
